name: Bug report
description: 插件无法启动、面板异常、安装失败等问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认：已升级到最新版本（`npx zcode-idea@latest update`），且不是
        「与桌面客户端同时运行」（共用 `~/.zcode`，SQLite 会锁）。
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: npm 包版本或 `plugins/zcode-ide/lib` 下的 jar 版本
      placeholder: 0.0.8
    validations:
      required: true
  - type: input
    id: ide
    attributes:
      label: IDE 与版本
      placeholder: IntelliJ IDEA 2026.2 / WebStorm 2025.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 安装 / 升级失败
        - 面板无法启动（server 起不来）
        - 界面异常 / 功能不可用
        - 索引期间不可用
        - 远控 / 手机连接
        - 其它
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开工具窗口 2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        IDE 日志：Help → Show Log in Explorer，取 `idea.log` 里含 `ZCodeIDE` 的最后几十行。
        安装问题请附安装器完整输出。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 已升级到最新版本
          required: true
        - label: 没有和桌面客户端同时运行
          required: true
