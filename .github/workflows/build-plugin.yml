name: build-plugin

# 唯一产出插件 zip 的流水线：fork 当构建输入，插件仓库当产品。
# fork 自己的 CI 只做编译体检，不产出插件包（见 .agents/docs/build/CI.md）。
on:
  workflow_dispatch:
    inputs:
      publishRuntime:
        description: "上传 runtime 到七牛（需要仓库 Secrets）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    # 必须 Windows：runtime 会拷贝 node-pty 等原生依赖，Linux 产物缺 Windows 预编译模块。
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # 签名私钥（必需）：Ed25519 PEM 原文或 base64；CI 缺失时 runtime 打包段失败，属预期闸门。
      RUNTIME_SIGNING_KEY: ${{ secrets.RUNTIME_SIGNING_KEY }}
      # 七牛发布配置（可选）：勾选 publishRuntime 时使用；缺 AK/SK/DOMAIN 会在发布段明确失败。
      QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
      QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
      QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
      QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
      QINIU_PREFIX: ${{ secrets.QINIU_PREFIX }}
      QINIU_UPLOAD_HOST: ${{ secrets.QINIU_UPLOAD_HOST }}
      # 发布开关：仅手动触发且勾选 publishRuntime 才置 1；tag push 一律为 0。
      CI_PUBLISH_RUNTIME: ${{ github.event_name == 'workflow_dispatch' && inputs.publishRuntime && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve pnpm store
        shell: pwsh
        run: echo "PNPM_STORE=$(pnpm store path)" >> $env:GITHUB_ENV

      # 缓存键跟 vendor/zcode.lock 走：锁不变就复用 fork 工作副本、node_modules 与 Gradle 缓存。
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.PNPM_STORE }}
            ~/.gradle/caches
            ~/.gradle/wrapper
            .intellijPlatform
            .ci
          key: ${{ runner.os }}-zcode-${{ hashFiles('vendor/zcode.lock') }}

      - name: Build plugin
        run: node scripts/ci-build.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: zcode-ide-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      # runtime 打包产物（zip + manifest + sig）；未打包（如本地无私钥跳过该段）时不存在，忽略缺文件。
      - uses: actions/upload-artifact@v4
        with:
          name: zcode-runtime-package
          path: build/runtime/*
          if-no-files-found: ignore
